# Standalone-release pipeline: on a v* tag, build, sign, and attach installers to the
# GitHub Release for both platforms.
#
#   macOS   -> Developer ID signed, notarized, stapled .dmg (arm64)
#   Windows -> Azure Artifact Signing (formerly Trusted Signing) signed Inno Setup
#              installer (x64; Inno Setup is preinstalled on windows-latest runners)
#
# Both jobs are gated by the "appstore" environment: a human approves each release run
# before any signing secret is released. All actions are SHA-pinned.
#
# workflow_dispatch runs the same signing path without cutting a release: it takes a version
# instead of reading the tag, and the result is uploaded as a build artifact rather than
# published. That is the only way to exercise Azure signing at all - the federated credential is
# OIDC scoped to the `appstore` environment, so the token exists only inside a run here.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp the build with (no leading v)'
        required: true
        default: '0.0.0-test'
      platform:
        description: 'Which side to build'
        required: true
        default: 'windows'
        type: choice
        options: [windows, macos, both]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (notarized dmg)
    runs-on: macos-15
    environment: appstore
    if: github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'both'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # A manual run has no tag to read the version from.
      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        env:
          DEVID_CERT_P12: ${{ secrets.DEVID_CERT_P12 }}
          DEVID_CERT_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVID_CERT_P12" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$DEVID_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

      - name: Build Developer ID signed app
        run: DEVID=1 bash macos/build-app.sh "$RUNNER_TEMP/Telidraw.app"

      - name: Notarize and staple app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$RUNNER_TEMP/Telidraw.app" "$RUNNER_TEMP/Telidraw-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Telidraw-notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$RUNNER_TEMP/Telidraw.app"

      - name: Package, sign, notarize, and staple dmg
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          DMG="$RUNNER_TEMP/Telidraw-$VERSION-macos-arm64.dmg"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$RUNNER_TEMP/Telidraw.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Telidraw" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          SIGN_ID="$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          codesign --force --timestamp --sign "$SIGN_ID" "$DMG"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber

      # Manual runs prove the signing path without publishing anything.
      - name: Upload dmg as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (signed installer)
    runs-on: windows-latest
    environment: appstore
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'both'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # A manual run has no tag to read the version from.
      - name: Resolve version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' }
               else { $env:GITHUB_REF_NAME -replace '^v', '' }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish app (win-x64, self-contained)
        run: dotnet publish Telidraw/Telidraw.csproj -c Release -f net10.0 -r win-x64 --self-contained true -p:PublishSingleFile=false -o "${{ runner.temp }}\publish"

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sign the app executable before it is packed into the installer.
      - name: Sign application executable
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ runner.temp }}\publish
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:VERSION" `
            "/DPublishDir=${{ runner.temp }}\publish" `
            "/O${{ runner.temp }}\installer" `
            windows\installer.iss

      # Second pass: sign the installer itself.
      - name: Sign installer
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ runner.temp }}\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Naming happens for both paths; only publishing is tag-only.
      - name: Name the installer
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}\installer\Telidraw-Setup.exe"
          $final = "${{ runner.temp }}\installer\Telidraw-$env:VERSION-windows-x64-Setup.exe"
          Move-Item $out $final
          "INSTALLER=$final" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Proves the signature actually took, rather than trusting the signing step's exit code.
      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature $env:INSTALLER
          "Status : $($sig.Status)"
          "Signer : $($sig.SignerCertificate.Subject)"
          "Issuer : $($sig.SignerCertificate.Issuer)"
          "Stamp  : $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer signature is $($sig.Status), expected Valid" }

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes 2>$null
          if ($LASTEXITCODE -ne 0) { $global:LASTEXITCODE = 0 }
          gh release upload $env:GITHUB_REF_NAME $env:INSTALLER --clobber

      # Manual runs prove the signing path without publishing anything.
      - name: Upload installer as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: ${{ env.INSTALLER }}
          if-no-files-found: error
          retention-days: 7
